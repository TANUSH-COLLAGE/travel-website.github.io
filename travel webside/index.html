<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Travel Website</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0b3d91, #e0f7fa); padding: 20px; }
    .login-container { background: #ffffff; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); width: 100%; max-width: 400px; text-align: center; }
    .login-header h2 { color: #0b3d91; font-size: 2rem; margin-bottom: 10px; text-transform: uppercase; }
    .login-header p { color: #666; font-size: 0.9rem; margin-bottom: 30px; }
    .input-group { position: relative; margin-bottom: 20px; }
    .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #0b3d91; }
    .input-group input { width: 100%; padding: 12px 15px 12px 45px; border: 1px solid #ccc; border-radius: 25px; font-size: 1rem; outline: none; }
    .input-group input:focus { border-color: #0b3d91; }
    .login-btn { width: 100%; padding: 12px; background: #0b3d91; color: white; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s ease; }
    .login-btn:hover { background: #062863; }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <h2>Sign In</h2>
    <p>Welcome back! Please enter your details.</p>
  </div>
  <div class="input-group">
    <i class="fas fa-user"></i>
    <input type="text" id="user" placeholder="Username" required>
  </div>
  <div class="input-group">
    <i class="fas fa-lock"></i>
    <input type="password" id="pass" placeholder="Password" required>
  </div>
  <button class="login-btn" onclick="login()">Login</button>
</div>

<script>
function login() {
  let u = document.getElementById("user").value.trim();
  let p = document.getElementById("pass").value.trim();
  if (u === "admin" && p === "1234") {
    localStorage.setItem("login", "yes");
    window.location.href = "home.html"; // Sahi login par home.html par bhejega
  } else {
    alert("Invalid Username or Password!");
  }
}
</script>
</body>
</html>
